openapi: 3.0.3
info:
  title: CS2 Tracker API
  description: >
    HTTP API for the CS2 stats tracker: player profiles and careers, parsed
    match detail, weapon/map breakdowns, a leaderboard, demo ingest with job
    status, and Steam identity resolution.
  version: "1.0.0"
servers:
  - url: http://localhost:8080
    description: Local development

paths:
  /api/health:
    get:
      summary: Readiness probe (pings Postgres)
      responses:
        "200": { description: Healthy }
        "503": { description: Degraded (database unreachable) }
  /metrics:
    get:
      summary: Prometheus HTTP request counters
      responses:
        "200":
          description: Prometheus text exposition
          content:
            text/plain: {}
  /openapi.yaml:
    get:
      summary: This OpenAPI document
      responses:
        "200":
          description: OpenAPI spec
          content:
            application/yaml: {}

  /api/resolve:
    get:
      summary: Resolve a vanity name or SteamID64 to a SteamID64
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Resolved id
          content:
            application/json:
              schema:
                type: object
                properties: { steamId64: { type: string } }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: Vanity resolution needs a Steam API key }

  /api/leaderboard:
    get:
      summary: Top analysed players by HLTV 1.0 rating (from demos CSRun parsed)
      description: |
        Defaults (min=1, days=0) are the historical board: everyone ever seen
        in a demo, which the sitemap uses as its profile inventory. The
        homepage asks for min=5&days=90 so a single lobby cannot top it.
        Cached ten minutes per (limit, min, days); rows without a Steam
        avatar are hydrated with one batch Steam call when a key is set.
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 25, minimum: 1, maximum: 100 } }
        - { name: min, in: query, description: Minimum demos analysed, schema: { type: integer, default: 1, minimum: 1, maximum: 50 } }
        - { name: days, in: query, description: Only players seen in a demo within this many days (0 = ever), schema: { type: integer, default: 0, minimum: 0, maximum: 3650 } }
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema:
                type: object
                properties:
                  players:
                    type: array
                    items: { $ref: "#/components/schemas/LeaderboardEntry" }
                  minMatches: { type: integer, description: The floor the rows passed }
                  windowDays: { type: integer, description: The window the rows passed (0 = ever) }
                  qualified: { type: integer, description: How many players passed in total, not just this page }
                  asOf: { type: string, format: date-time, nullable: true, description: Newest demo ingest among the qualifying players; null when none }

  /api/faceit/rankings:
    get:
      summary: FACEIT's published CS2 leaderboard for one region (homepage strip)
      description: |
        Cached an hour fresh and a day stale per region; a FACEIT outage serves
        the last good board with stale=true and its real fetchedAt. Rows carry
        steamId64/avatar when FACEIT's player object lists a CS2 account. Never
        touches Leetify.
      parameters:
        - { name: region, in: query, schema: { type: string, enum: [EU, NA, SA, AS, OCE], default: EU } }
        - { name: limit, in: query, schema: { type: integer, default: 10, minimum: 1, maximum: 20 } }
      responses:
        "200":
          description: The region's top players (enabled=false with an empty list when no FACEIT key is configured)
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  region: { type: string }
                  players:
                    type: array
                    items: { $ref: "#/components/schemas/FaceitRankedPlayer" }
                  fetchedAt: { type: string, format: date-time, description: When FACEIT was asked for this snapshot }
                  stale: { type: boolean, description: True when served from the day-long stale copy because FACEIT is not answering }
        "400": { description: Unknown region }
        "503": { description: FACEIT is unavailable and no stale copy exists (Cache-Control no-store, Retry-After 300) }

  /api/search:
    get:
      summary: Autocomplete search over known players (name / vanity)
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 8 } }
      responses:
        "200":
          description: Matching players
          content:
            application/json:
              schema:
                type: object
                properties:
                  players:
                    type: array
                    items:
                      type: object
                      properties:
                        steamId64: { type: string }
                        personaName: { type: string }
                        avatarUrl: { type: string }

  /api/players/{steamid}:
    get:
      summary: Player profile (identity + rolling career)
      parameters: [{ $ref: "#/components/parameters/SteamID" }]
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayerProfile" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/players/{steamid}/refresh:
    post:
      summary: Re-fetch identity from the Steam Web API (needs key)
      parameters: [{ $ref: "#/components/parameters/SteamID" }]
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayerProfile" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: Steam API key not configured }

  /api/players/{steamid}/matches:
    get:
      summary: A player's recent matches with their per-match line
      parameters:
        - { $ref: "#/components/parameters/SteamID" }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Matches
          content:
            application/json:
              schema:
                type: object
                properties:
                  matches:
                    type: array
                    items: { $ref: "#/components/schemas/PlayerMatchSummary" }

  /api/players/{steamid}/weapons:
    get:
      summary: Per-weapon kills and headshot %
      parameters:
        - { $ref: "#/components/parameters/SteamID" }
        - { name: limit, in: query, schema: { type: integer, default: 12 } }
      responses:
        "200":
          description: Weapon stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  weapons:
                    type: array
                    items: { $ref: "#/components/schemas/WeaponStat" }

  /api/players/{steamid}/maps:
    get:
      summary: Per-map career breakdown
      parameters: [{ $ref: "#/components/parameters/SteamID" }]
      responses:
        "200":
          description: Map stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  maps:
                    type: array
                    items: { $ref: "#/components/schemas/MapStat" }

  /api/players/{steamid}/leetify:
    get:
      summary: Live Leetify profile (fetched real-time; attributed to Leetify)
      parameters: [{ $ref: "#/components/parameters/SteamID" }]
      responses:
        "200": { description: Leetify profile (ratings, ranks, stats) }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/players/{steamid}/faceit:
    get:
      summary: Live FACEIT profile (CS2 skill level, ELO, lifetime stats; needs FACEIT_API_KEY)
      parameters: [{ $ref: "#/components/parameters/SteamID" }]
      responses:
        "200": { description: FACEIT profile }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: FACEIT integration not configured }

  /api/players/{steamid}/steam-stats:
    get:
      summary: Raw Steam App 730 lifetime stats (needs key)
      parameters: [{ $ref: "#/components/parameters/SteamID" }]
      responses:
        "200": { description: Stat map }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: Steam API key not configured }

  /api/players/{steamid}/steam-extras:
    get:
      summary: CS2 friend code (always) + best-effort friends count & Steam level
      parameters: [{ $ref: "#/components/parameters/SteamID" }]
      responses:
        "200":
          description: Steam extras
          content:
            application/json:
              schema:
                type: object
                properties:
                  steamId64: { type: string }
                  friendCode: { type: string }
                  friends: { type: integer }
                  steamLevel: { type: integer }

  /api/matches/{id}:
    get:
      summary: Full match detail (scoreboard + rounds)
      parameters: [{ $ref: "#/components/parameters/MatchID" }]
      responses:
        "200":
          description: Match detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatchDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/matches/{id}/kills:
    get:
      summary: Ordered killfeed for a match
      parameters: [{ $ref: "#/components/parameters/MatchID" }]
      responses:
        "200":
          description: Killfeed
          content:
            application/json:
              schema:
                type: object
                properties:
                  kills:
                    type: array
                    items: { $ref: "#/components/schemas/Kill" }

  /api/ingest/demo:
    post:
      summary: Enqueue a demo parse job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                demoPath: { type: string }
                demoUrl: { type: string }
                shareCode: { type: string }
                source: { type: string }
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId: { type: string }
                  status: { type: string }
                  statusUrl: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/jobs/{id}:
    get:
      summary: Parse-job status
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestJob" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/queue:
    get:
      summary: Pending parse-job count
      responses:
        "200":
          description: Depth
          content:
            application/json:
              schema:
                type: object
                properties: { depth: { type: integer, format: int64 } }

components:
  parameters:
    SteamID:
      name: steamid
      in: path
      required: true
      description: SteamID64 (17-digit)
      schema: { type: string }
    MatchID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      properties: { error: { type: string } }
    Player:
      type: object
      properties:
        steamId64: { type: string }
        personaName: { type: string }
        avatarUrl: { type: string }
        profileUrl: { type: string }
        countryCode: { type: string }
    PlayerCareer:
      type: object
      properties:
        matches: { type: integer }
        wins: { type: integer }
        losses: { type: integer }
        roundsPlayed: { type: integer }
        kills: { type: integer, format: int64 }
        deaths: { type: integer, format: int64 }
        utilityDamage: { type: integer, format: int64 }
        enemiesFlashed: { type: integer, format: int64 }
        mvps: { type: integer, format: int64 }
        rating: { type: number }
        adr: { type: number }
        kastPct: { type: number }
        hsPct: { type: number }
        kd: { type: number }
        winRate: { type: number }
    PlayerProfile:
      type: object
      properties:
        player: { $ref: "#/components/schemas/Player" }
        career: { $ref: "#/components/schemas/PlayerCareer" }
    Match:
      type: object
      properties:
        id: { type: integer, format: int64 }
        map: { type: string }
        playedAt: { type: string, format: date-time }
        durationSeconds: { type: integer }
        roundsTotal: { type: integer }
        teamAScore: { type: integer }
        teamBScore: { type: integer }
        tickRate: { type: number }
    MatchPlayer:
      type: object
      properties:
        steamId64: { type: string }
        personaName: { type: string }
        startSide: { type: string, enum: ["CT", "T", ""] }
        kills: { type: integer }
        deaths: { type: integer }
        assists: { type: integer }
        adr: { type: number }
        kastPct: { type: number }
        hsPct: { type: number }
        rating: { type: number }
        won: { type: boolean }
    PlayerMatchSummary:
      type: object
      properties:
        match: { $ref: "#/components/schemas/Match" }
        line: { $ref: "#/components/schemas/MatchPlayer" }
    Round:
      type: object
      properties:
        number: { type: integer }
        winnerSide: { type: string, enum: ["CT", "T", ""] }
        endReason: { type: string }
        ctBuy: { type: string }
        tBuy: { type: string }
        ctEquipValue: { type: integer }
        tEquipValue: { type: integer }
    MatchDetail:
      type: object
      properties:
        match: { $ref: "#/components/schemas/Match" }
        players:
          type: array
          items: { $ref: "#/components/schemas/MatchPlayer" }
        rounds:
          type: array
          items: { $ref: "#/components/schemas/Round" }
    Kill:
      type: object
      properties:
        round: { type: integer }
        timeSeconds: { type: number }
        killerId: { type: string }
        victimId: { type: string }
        assisterId: { type: string }
        weapon: { type: string }
        headshot: { type: boolean }
        opening: { type: boolean }
        trade: { type: boolean }
    WeaponStat:
      type: object
      properties:
        weapon: { type: string }
        kills: { type: integer }
        headshots: { type: integer }
        hsPct: { type: number }
    MapStat:
      type: object
      properties:
        map: { type: string }
        matches: { type: integer }
        wins: { type: integer }
        losses: { type: integer }
        winRate: { type: number }
        rating: { type: number }
        adr: { type: number }
        kd: { type: number }
        hsPct: { type: number }
    LeaderboardEntry:
      type: object
      properties:
        steamId64: { type: string }
        personaName: { type: string }
        avatarUrl: { type: string }
        matches: { type: integer }
        rating: { type: number }
        kd: { type: number }
        adr: { type: number }
        winRate: { type: number }
    FaceitRankedPlayer:
      type: object
      properties:
        playerId: { type: string, description: FACEIT player id }
        nickname: { type: string }
        country: { type: string, description: lower-case ISO 3166-1 alpha-2 }
        position: { type: integer }
        elo: { type: integer }
        skillLevel: { type: integer }
        avatar: { type: string }
        faceitUrl: { type: string }
        steamId64: { type: string, description: Present when FACEIT lists a CS2 account for the player }
    IngestJob:
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        status: { type: string, enum: [queued, running, done, failed] }
        matchId: { type: integer, format: int64 }
        error: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
