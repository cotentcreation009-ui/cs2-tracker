<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CSRun</title>
    <link rel="stylesheet" href="tokens.css" />
    <style>
      :root { color-scheme: dark; }
      body {
        width: 320px;
        margin: 0;
        background: var(--sr-bg);
        color: var(--sr-ink);
        font: 400 12px/1.35 var(--sr-font);
        -webkit-font-smoothing: antialiased;
      }
      a { color: var(--sr-brand); text-decoration: none; }
      a:hover { text-decoration: underline; }
      a:focus-visible,
      button:focus-visible { outline: 2px solid var(--sr-brand); outline-offset: 2px; }

      .sr-spacer { flex: 1; }

      /* header */
      .sr-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px;
        border-bottom: 1px solid var(--sr-line);
      }
      .sr-word { font-size: 13px; font-weight: 700; color: var(--sr-ink); }
      .sr-word b { color: var(--sr-brand); font-weight: 700; }

      /* toggle switch: 32x18 track, 14px knob */
      .sr-switch { position: relative; display: inline-block; width: 32px; height: 18px; flex: none; }
      .sr-switch input {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        opacity: 0;
        cursor: pointer;
      }
      .sr-track {
        position: absolute;
        inset: 0;
        background: var(--sr-line2);
        border-radius: 9px;
        pointer-events: none;
        transition: background 120ms ease-out;
      }
      .sr-track::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--sr-ink);
        transition: transform 120ms ease-out;
      }
      .sr-switch input:checked + .sr-track { background: var(--sr-brand); }
      .sr-switch input:checked + .sr-track::after { transform: translateX(14px); }
      .sr-switch input:focus-visible + .sr-track { outline: 2px solid var(--sr-brand); outline-offset: 2px; }

      /* body */
      .sr-body { padding: 12px; display: flex; flex-direction: column; gap: 12px; }
      .sr-look { display: flex; gap: 8px; }
      .sr-input {
        flex: 1;
        min-width: 0;
        height: 28px;
        padding: 0 8px;
        background: var(--sr-panel);
        border: 1px solid var(--sr-line);
        border-radius: var(--sr-r-chip);
        color: var(--sr-ink);
        font: 400 12px/1 var(--sr-font);
        transition: border-color 120ms ease-out;
      }
      .sr-input::placeholder { color: var(--sr-faint); }
      .sr-input:hover { border-color: var(--sr-line2); }
      .sr-input:focus { outline: 2px solid var(--sr-brand); outline-offset: 2px; border-color: var(--sr-brand); }
      .sr-btn {
        height: 28px;
        padding: 0 10px;
        background: var(--sr-panel2);
        border: 1px solid var(--sr-line2);
        border-radius: var(--sr-r-chip);
        color: var(--sr-ink);
        font: 700 11px/1 var(--sr-font);
        cursor: pointer;
        transition: border-color 120ms ease-out, color 120ms ease-out;
      }
      .sr-btn:hover { border-color: var(--sr-brand); color: var(--sr-brand); }

      .sr-hint { margin: 0; font-size: 11px; color: var(--sr-muted); }

      /* mini result card */
      .sr-mini { padding: 12px; display: flex; flex-direction: column; gap: 12px; }
      .sr-mini-head { display: flex; align-items: center; gap: 8px; }
      .sr-name {
        flex: 1;
        min-width: 0;
        font-size: 13px;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .sr-flags { display: flex; gap: 4px; flex: none; }
      .sr-bandchip { text-transform: uppercase;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 18px;
        padding: 2px 6px;
        box-sizing: border-box;
        border-radius: var(--sr-r-chip);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: var(--band);
        border: 1px solid color-mix(in srgb, var(--band) 45%, transparent);
        background: color-mix(in srgb, var(--band) 12%, transparent);
        white-space: nowrap;
      }
      .sr-bandchip .sr-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--band); }
      .sr-mini-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
      .sr-stat { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
      .sr-val { display: flex; align-items: center; gap: 6px; height: 18px; font-size: 12px; font-weight: 700; }
      .sr-lvlb {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 16px;
        height: 16px;
        flex: none;
        border-radius: var(--sr-r-chip);
        font-size: 10px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .sr-elo { color: var(--sr-orange); }
      .sr-plate {
        display: inline-flex;
        align-items: center;
        height: 18px;
        padding: 2px 6px;
        box-sizing: border-box;
        border-radius: var(--sr-r-chip);
        font-size: 11px;
        font-weight: 700;
        color: color-mix(in srgb, var(--tier) 62%, white);
        border: 1px solid color-mix(in srgb, var(--tier) 45%, transparent);
        background: color-mix(in srgb, var(--tier) 12%, transparent);
      }
      .sr-none { color: var(--sr-faint); font-weight: 400; }
      .sr-report { font-size: 12px; font-weight: 600; align-self: flex-start; }
      .sr-msg { padding: 12px; font-size: 12px; color: var(--sr-muted); }

      /* loading skeleton */
      .sr-skel-name { height: 14px; width: 56%; }
      .sr-skel-stat { height: 32px; }
      .sr-skel-link { height: 10px; width: 76px; }

      /* footer */
      .sr-foot {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 12px;
        border-top: 1px solid var(--sr-line);
      }
      .sr-ver { font-size: 10px; color: var(--sr-faint); }
      .sr-foot a { font-size: 11px; }
      #opts { color: var(--sr-muted); }
      #opts:hover { color: var(--sr-ink); }

      @media (prefers-reduced-motion: reduce) {
        .sr-track,
        .sr-track::after,
        .sr-input,
        .sr-btn { transition: none; }
      }
    </style>
  </head>
  <body>
    <header class="sr-head">
      <span class="sr-word">CS<b>Run</b></span>
      <span class="sr-spacer"></span>
      <span class="sr-switch" title="Enable CSRun">
        <input type="checkbox" id="enabled" aria-label="Enable CSRun on FACEIT and Steam" />
        <span class="sr-track"></span>
      </span>
    </header>

    <main class="sr-body">
      <form class="sr-look" id="lookup">
        <input
          class="sr-input"
          id="q"
          type="text"
          placeholder="FACEIT nickname or SteamID64"
          autocomplete="off"
          spellcheck="false"
          maxlength="64"
          aria-label="FACEIT nickname or SteamID64"
        />
        <button class="sr-btn" type="submit">Look up</button>
      </form>
      <div id="result" aria-live="polite">
        <p class="sr-hint">CheatMeter, elo and cross-platform ranks for any player.</p>
      </div>
    </main>

    <footer class="sr-foot">
      <span class="sr-ver sr-num" id="version"></span>
      <span class="sr-spacer"></span>
      <a href="#" id="opts">Settings</a>
      <a href="https://csrun.win" id="site" target="_blank" rel="noreferrer">csrun.win</a>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
