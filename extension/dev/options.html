<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>StatRun settings</title>
    <link rel="stylesheet" href="../src/tokens.css" />
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        background: var(--sr-bg);
        color: var(--sr-ink);
        font: 400 12px/1.4 var(--sr-font);
        -webkit-font-smoothing: antialiased;
      }
      a { color: var(--sr-brand); text-decoration: none; }
      a:hover { text-decoration: underline; }
      a:focus-visible { outline: 2px solid var(--sr-brand); outline-offset: 2px; }

      .sr-wrap {
        max-width: 520px;
        margin: 0 auto;
        padding: 32px 20px 48px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .sr-spacer { flex: 1; }

      /* header */
      .sr-head { display: flex; align-items: baseline; gap: 8px; }
      .sr-word { font-size: 13px; font-weight: 700; color: var(--sr-ink); }
      .sr-word b { color: var(--sr-brand); font-weight: 700; }
      .sr-ver { font-size: 10px; color: var(--sr-faint); }
      .sr-head a { font-size: 11px; }

      /* setting groups */
      h2.sr-label { margin: 0; padding: 12px 12px 0; }
      .sr-row { display: flex; align-items: center; gap: 12px; padding: 12px; }
      .sr-row + .sr-row { border-top: 1px solid var(--sr-line); }
      label.sr-row { cursor: pointer; }
      .sr-row-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
      .sr-row-title { font-size: 12px; font-weight: 600; color: var(--sr-ink); }
      .sr-row-desc { font-size: 11px; color: var(--sr-muted); }
      .sr-note {
        margin: 0;
        padding: 8px 12px 12px;
        border-top: 1px solid var(--sr-line);
        font-size: 11px;
        color: var(--sr-faint);
      }
      .sr-row--field { flex-direction: column; align-items: stretch; gap: 8px; }

      /* toggle switch: 32x18 track, 14px knob */
      .sr-switch { position: relative; display: inline-block; width: 32px; height: 18px; flex: none; }
      .sr-switch input {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        opacity: 0;
        cursor: pointer;
      }
      .sr-track {
        position: absolute;
        inset: 0;
        background: var(--sr-line2);
        border-radius: 9px;
        pointer-events: none;
        transition: background 120ms ease-out;
      }
      .sr-track::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--sr-ink);
        transition: transform 120ms ease-out;
      }
      .sr-switch input:checked + .sr-track { background: var(--sr-brand); }
      .sr-switch input:checked + .sr-track::after { transform: translateX(14px); }
      .sr-switch input:focus-visible + .sr-track { outline: 2px solid var(--sr-brand); outline-offset: 2px; }

      /* text input */
      .sr-input {
        width: 100%;
        box-sizing: border-box;
        height: 28px;
        padding: 0 8px;
        background: var(--sr-bg);
        border: 1px solid var(--sr-line);
        border-radius: var(--sr-r-chip);
        color: var(--sr-ink);
        font: 400 12px/1 var(--sr-font);
        font-variant-numeric: tabular-nums;
        transition: border-color 120ms ease-out;
      }
      .sr-input::placeholder { color: var(--sr-faint); }
      .sr-input:hover { border-color: var(--sr-line2); }
      .sr-input:focus { outline: 2px solid var(--sr-brand); outline-offset: 2px; border-color: var(--sr-brand); }

      /* saved microtoast */
      .sr-toast {
        position: fixed;
        bottom: 16px;
        left: 50%;
        transform: translate(-50%, 4px);
        opacity: 0;
        padding: 4px 10px;
        background: var(--sr-panel2);
        border: 1px solid var(--sr-line2);
        border-radius: var(--sr-r-chip);
        box-shadow: var(--sr-shadow);
        color: var(--sr-good);
        font-size: 11px;
        font-weight: 700;
        pointer-events: none;
        transition: opacity 120ms ease-out, transform 120ms ease-out;
      }
      .sr-toast.sr-show { opacity: 1; transform: translate(-50%, 0); }

      @media (prefers-reduced-motion: reduce) {
        .sr-track,
        .sr-track::after,
        .sr-input,
        .sr-toast { transition: none; }
      }
    </style>
  </head>
  <body>
    <div class="sr-wrap">
      <header class="sr-head">
        <span class="sr-word">Stat<b>Run</b></span>
        <span class="sr-label">Settings</span>
        <span class="sr-spacer"></span>
        <span class="sr-ver sr-num" id="version"></span>
        <a href="https://csrun.win" target="_blank" rel="noreferrer">csrun.win</a>
      </header>

      <section class="sr-card">
        <h2 class="sr-label">Overlay</h2>
        <label class="sr-row">
          <span class="sr-row-text">
            <span class="sr-row-title">Player chips</span>
            <span class="sr-row-desc">CheatMeter score beside player names across faceit.com.</span>
          </span>
          <span class="sr-switch">
            <input type="checkbox" data-key="feature.chips" />
            <span class="sr-track"></span>
          </span>
        </label>
        <label class="sr-row">
          <span class="sr-row-text">
            <span class="sr-row-title">Match room panel</span>
            <span class="sr-row-desc">Team stats, win estimate and map veto numbers in match rooms.</span>
          </span>
          <span class="sr-switch">
            <input type="checkbox" data-key="feature.matchroom" />
            <span class="sr-track"></span>
          </span>
        </label>
        <label class="sr-row">
          <span class="sr-row-text">
            <span class="sr-row-title">Profile widget</span>
            <span class="sr-row-desc">Elo progress and recent deltas on player profiles.</span>
          </span>
          <span class="sr-switch">
            <input type="checkbox" data-key="feature.profile" />
            <span class="sr-track"></span>
          </span>
        </label>
        <label class="sr-row">
          <span class="sr-row-text">
            <span class="sr-row-title">Steam panel</span>
            <span class="sr-row-desc">CheatMeter and cross-platform ranks on Steam profiles.</span>
          </span>
          <span class="sr-switch">
            <input type="checkbox" data-key="feature.steam" />
            <span class="sr-track"></span>
          </span>
        </label>
      </section>

      <section class="sr-card">
        <h2 class="sr-label">Automation</h2>
        <label class="sr-row">
          <span class="sr-row-text">
            <span class="sr-row-title">Auto-accept</span>
            <span class="sr-row-desc">Clicks Accept for you when a match is found.</span>
          </span>
          <span class="sr-switch">
            <input type="checkbox" data-key="auto.accept" />
            <span class="sr-track"></span>
          </span>
        </label>
        <label class="sr-row">
          <span class="sr-row-text">
            <span class="sr-row-title">Close pop-ups</span>
            <span class="sr-row-desc">Dismisses recurring FACEIT dialog pop-ups as they appear.</span>
          </span>
          <span class="sr-switch">
            <input type="checkbox" data-key="auto.closeModals" />
            <span class="sr-track"></span>
          </span>
        </label>
        <p class="sr-note">Use at your own discretion — automates clicks on faceit.com.</p>
      </section>

      <section class="sr-card">
        <h2 class="sr-label">Notifications</h2>
        <label class="sr-row">
          <span class="sr-row-text">
            <span class="sr-row-title">Match ready</span>
            <span class="sr-row-desc">System notification when your match is waiting on Accept.</span>
          </span>
          <span class="sr-switch">
            <input type="checkbox" data-key="notify.matchReady" />
            <span class="sr-track"></span>
          </span>
        </label>
      </section>

      <section class="sr-card">
        <h2 class="sr-label">Advanced</h2>
        <div class="sr-row sr-row--field">
          <label class="sr-row-text" for="apiBase">
            <span class="sr-row-title">API base</span>
            <span class="sr-row-desc">Where the extension reads StatRun data from. Leave the default unless you run your own instance.</span>
          </label>
          <input
            class="sr-input"
            id="apiBase"
            type="text"
            placeholder="https://csrun.win"
            autocomplete="off"
            spellcheck="false"
          />
        </div>
      </section>
    </div>

    <div class="sr-toast" id="toast" role="status" aria-live="polite">Saved</div>

    <script src="chrome-stub.js"></script><script src="../src/options.js"></script>
  </body>
</html>
